<body class="bg-slate-100 text-slate-800 h-screen overflow-hidden flex flex-col">
<header class="shrink-0 h-12 bg-slate-800 text-slate-100 flex items-center px-3 gap-3 border-b border-slate-700">

    <span class="text-sm font-semibold whitespace-nowrap">数字孪生管理后台</span>
  </div>
  <nav id="topNav" class="flex-1 min-w-0 flex items-center gap-0.5 overflow-x-auto text-sm h-full"></nav>
  <div class="shrink-0 flex items-center gap-3 text-xs text-slate-400 pl-2">
    <a id="hdrWall" class="hover:text-white" href="#" target="_blank">打开大屏</a>
    <a class="hover:text-white" href="../index.html">版本首页</a>
  </div>
</header>

<div class="flex-1 min-h-0 flex work-area">
  <aside class="w-56 shrink-0 bg-white border-r border-slate-200 flex flex-col">
    <div class="px-4 py-3 border-b border-slate-100">
      <div class="text-[11px] text-slate-400" id="sideHint">二级菜单</div>
      <div class="text-sm font-semibold mt-0.5 truncate" id="sideTheme">港区概览</div>
    </div>
    <nav id="sideNav" class="flex-1 overflow-auto p-2 space-y-0.5 text-sm"></nav>
  </aside>

  <main class="flex-1 min-w-0 flex flex-col bg-slate-50">
    <div class="shrink-0 h-11 bg-white border-b border-slate-200 px-4 flex items-center justify-between gap-3">
      <div class="text-sm text-slate-500 truncate">
        <span>管理后台</span>
        <span class="mx-1.5 text-slate-300">/</span>
        <span id="crumbTheme">港区概览</span>
        <span class="mx-1.5 text-slate-300">/</span>
        <span class="text-slate-800 font-medium" id="crumbMod">概览总控</span>
      </div>
      <span class="text-[11px] px-2 py-0.5 rounded bg-slate-100 text-slate-500 border border-slate-200">本地演示</span>
    </div>
    <div class="flex-1 min-h-0">
      <iframe id="themeFrame" title="配置内容" src="about:blank"></iframe>
    </div>
  </main>
</div>

      { key: 'plan', title: '待泊船舶计划', icon: 'fa-ship' },

      { key: 'alarm', title: '报警中心', icon: 'fa-bell' },

    ]
  },
  traffic: {

      { key: 'struct', title: '在港车辆结构', icon: 'fa-car' },
      { key: 'eff', title: '集疏运效率', icon: 'fa-gauge-high' },
      { key: 'focus', title: '重点车辆动态', icon: 'fa-truck-fast' },
      { key: 'node', title: '关键节点运行', icon: 'fa-map-location-dot' },

    ]
  },
  equipment: {

    sideHint: '二级菜单 · 数据模块',
    modules: [
      { key: 'home', title: '总控', icon: 'fa-gauge' },
      { key: 'stat', title: '作业统计', icon: 'fa-chart-simple' },
      { key: 'ledger', title: '设备台账', icon: 'fa-list' },
      { key: 'util', title: '利用率时间构成', icon: 'fa-clock' },

    ]
  },
  business: {
    title: '经营分析',
    page: 'admin_business.html',
    wall: 'pc_wall_theme_business.html',
    icon: 'fa-chart-pie',
    sideHint: '二级菜单 · 数据模块',
    modules: [
      { key: 'home', title: '总控', icon: 'fa-gauge' },
      { key: 'tp', title: '吞吐汇总', icon: 'fa-chart-simple' },
      { key: 'flow', title: '货种与流向', icon: 'fa-right-left' },
      { key: 'cust', title: '客户规模与结构', icon: 'fa-users' },
      { key: 'region', title: '国家区域占比', icon: 'fa-globe' },
      { key: 'eff', title: '效率与泊位', icon: 'fa-anchor' },
      { key: 'contract', title: '合同额', icon: 'fa-file-signature' },
      { key: 'cash', title: '资金回收', icon: 'fa-coins' }
    ]
  },
  dispatch: {
    title: '智慧调度',
    page: 'admin_dispatch.html',
    wall: 'pc_wall_theme_dispatch.html',
    icon: 'fa-bell',
    sideHint: '二级菜单 · 数据模块',
    modules: [
      { key: 'home', title: '总控', icon: 'fa-gauge' },
      { key: 'biz', title: '调度业务', icon: 'fa-briefcase' },
      { key: 'duty', title: '值守与响应', icon: 'fa-user-shield' },
      { key: 'event', title: '重点事件监控', icon: 'fa-bell' },
      { key: 'review', title: '事件回顾', icon: 'fa-clock-rotate-left' },
      { key: 'res', title: '应急资源台账', icon: 'fa-boxes-stacked' },
      { key: 'point', title: '应急物资点', icon: 'fa-location-dot' },
      { key: 'video', title: '安全监控', icon: 'fa-video' }
    ]
  },
  base: {
    title: '基础配置',
    page: 'admin_base.html',
    wall: 'pc_wall_command_screen.html',
    icon: 'fa-sliders',
    sideHint: '二级菜单 · 底座配置',
    modules: [
      { key: 'model', title: '模型管理', icon: 'fa-cube' },
      { key: 'theme', title: '多主题管理', icon: 'fa-layer-group' },
      { key: 'module', title: '模块管理', icon: 'fa-table-cells' },
      { key: 'scene', title: '场景编辑', icon: 'fa-pen-ruler' },
      { key: 'resource', title: '资源中心', icon: 'fa-boxes-stacked' },
      { key: 'session', title: '大屏会话控制', icon: 'fa-tower-broadcast' },
      { key: 'status', title: '接口与数据状态', icon: 'fa-heart-pulse' }
    ]
  }
};

const NAV_KEYS = Object.keys(NAV);
let curTheme = 'base';
let curMod = 'model';
let frameTheme = '';

function paintTopNav() {
  document.getElementById('topNav').innerHTML = NAV_KEYS.map((k) => {
    const t = NAV[k];
    return `<a href="#${k}/${t.modules[0].key}" data-theme="${k}" class="l1 shrink-0 h-full flex items-center gap-1.5 px-3 border-b-2 border-transparent text-slate-300 hover:text-white hover:bg-slate-700/50">
      <i class="fa-solid ${t.icon} text-xs opacity-80"></i><span>${t.title}</span>
    </a>`;
  }).join('');
  document.querySelectorAll('#topNav .l1').forEach((a) => {
    a.addEventListener('click', (e) => {
      e.preventDefault();
      const key = a.getAttribute('data-theme');
      go(key, NAV[key].modules[0].key);
    });
  });
}

function paintSideNav() {
  const t = NAV[curTheme];
  document.getElementById('sideHint').textContent = t.sideHint || '二级菜单';
  document.getElementById('sideTheme').textContent = t.title;
  document.getElementById('sideNav').innerHTML = t.modules.map((m) => {
    const on = m.key === curMod;
    return `<a href="#${curTheme}/${m.key}" data-mod="${m.key}" class="l2 flex items-center gap-2 rounded-lg px-3 py-2 ${on ? 'bg-slate-800 text-white' : 'text-slate-600 hover:bg-slate-100'}">
      <i class="fa-solid ${m.icon} w-4 text-center text-xs ${on ? 'opacity-90' : 'text-slate-400'}"></i>
      <span class="truncate">${m.title}</span>
    </a>`;
  }).join('');
  document.querySelectorAll('#sideNav .l2').forEach((a) => {
    a.addEventListener('click', (e) => {
      e.preventDefault();
      go(curTheme, a.getAttribute('data-mod'));
    });
  });
}

function setTopActive() {
  document.querySelectorAll('#topNav .l1').forEach((a) => {
    const on = a.getAttribute('data-theme') === curTheme;
    a.classList.toggle('border-sky-400', on);
    a.classList.toggle('text-white', on);
    a.classList.toggle('bg-slate-700/40', on);
    a.classList.toggle('text-slate-300', !on);
  });
}

function syncChrome() {
  const t = NAV[curTheme];
  const m = t.modules.find((x) => x.key === curMod) || t.modules[0];
  document.getElementById('crumbTheme').textContent = t.title;
  document.getElementById('crumbMod').textContent = m.title;
  document.getElementById('hdrWall').href = t.wall;
  setTopActive();
  paintSideNav();
}

function frameUrl() {
  const t = NAV[curTheme];
  return t.page + '?embed=1&panel=' + encodeURIComponent(curMod) + '&v=20261119scene2#' + curMod;
}

function switchFramePanel() {
  const frame = document.getElementById('themeFrame');
  try {
    const win = frame.contentWindow;
    if (win && typeof win.showPanel === 'function') {
      win.showPanel(curMod, { silentHash: true });
      try {
        if (win.location.hash !== '#' + curMod) win.location.hash = curMod;
      } catch (e) {}
      return true;
    }
  } catch (e) {}
  return false;
}

function loadFrame(forceReload) {
  const frame = document.getElementById('themeFrame');
  const target = frameUrl();
  // 同主题只切二级菜单：优先页内切换，避免整页重载闪白
  if (!forceReload && frameTheme === curTheme) {
    if (switchFramePanel()) return;
  }
  frameTheme = curTheme;
  frame.onload = function () {
    frame.onload = null;
    switchFramePanel();
  };
  frame.src = target;
}

function applyRoute(theme, mod) {
  if (!NAV[theme]) theme = 'base';
  const t = NAV[theme];
  if (!t.modules.some((m) => m.key === mod)) mod = t.modules[0].key;
  const themeChanged = curTheme !== theme || frameTheme !== theme;
  const modChanged = curMod !== mod;
  const firstLoad = !frameTheme;
  curTheme = theme;
  curMod = mod;
  syncChrome();
  if (firstLoad || themeChanged) loadFrame(true);
  else if (modChanged) loadFrame(false);
}

function go(theme, mod) {
  if (!NAV[theme]) theme = 'base';
  const t = NAV[theme];
  if (!t.modules.some((m) => m.key === mod)) mod = t.modules[0].key;
  const next = '#' + theme + '/' + mod;
  if (location.hash !== next) location.hash = next;
  else applyRoute(theme, mod);
}

function route() {
  const raw = (location.hash || '#base/model').replace(/^#/, '');
  const parts = raw.split('/');
  applyRoute(parts[0] || 'base', parts[1] || 'model');
}

paintTopNav();
window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
