<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>港区交通一张图 · 海南金牌港 · v1.0.0</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="../vendor/font-awesome/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700;800&display=swap');
*{font-family:'Noto Sans SC','Microsoft YaHei',sans-serif;box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#030712;color:#fff}
body{display:flex;flex-direction:column}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.wall{position:relative;aspect-ratio:16/9;width:min(98vw,calc(98vh*16/9));height:min(98vh,calc(98vw*9/16));overflow:hidden;border:1px solid rgba(14,116,240,.35);box-shadow:0 0 40px rgba(0,0,0,.55);background:#030712}
.wall>img.shot{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;display:block;pointer-events:none;user-select:none}
.chrome{position:absolute;z-index:20;left:12px;top:6px;display:flex;gap:8px;align-items:center}
.chrome a,.chrome button{color:#e2e8f0;border:1px solid rgba(148,163,184,.35);background:rgba(15,23,42,.72);border-radius:6px;padding:4px 9px;cursor:pointer;text-decoration:none;font-size:12px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.hot{position:absolute;z-index:10;display:block;border:0;background:transparent;cursor:pointer;padding:0}
.hot:hover{outline:1px solid rgba(0,228,255,.35);outline-offset:1px;background:rgba(0,228,255,.06)}
.hot.on{cursor:default}
.hot.on:hover{outline:none;background:transparent}
body.present .chrome{display:none}
body.present .stage{position:fixed;inset:0;z-index:50;background:#020617}
.toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:rgba(8,28,62,.95);border:1px solid rgba(14,116,240,.28);padding:8px 14px;border-radius:8px;font-size:12px;opacity:0;transition:.2s;z-index:40}
.toast.show{opacity:1}
#themes{display:none}
.badge{position:absolute;right:12px;top:6px;z-index:20;font-size:11px;color:#94a3b8;background:rgba(15,23,42,.72);border:1px solid rgba(148,163,184,.35);border-radius:6px;padding:4px 8px}
</style>
</head>
<body>
<div class="stage">
  <div class="wall" aria-label="港区交通一张图 · Figma 1:1">
    <img class="shot" src="../assets/figma/traf-screen.png" alt="港区交通一张图 Figma 原稿">
    <div class="chrome">
      <a href="../index.html">入口</a>
      <a href="pc_wall_command_screen.html?from=%E4%BA%A4%E9%80%9A">概览总览</a>
      <button type="button" id="btnPresent">汇报全屏</button>
    </div>
    <div class="badge">v1.0.0 · Figma 视觉 1:1 · 交通</div>
    <div id="figma-nav"></div>
    <div id="themes"></div>
  </div>
</div>
<script src="wall_domain.js"></script>
<script src="wall_theme_nav.js"></script>
<script src="wall_figma_1to1.js"></script>
<script>
initFigmaScreen('交通', {
  bottom: { start: 25.9, itemW: 7.6, gap: 0.52, top: 95.3, h: 3.7 }
});
</script>
</body>
</html>
