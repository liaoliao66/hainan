  </div>
  <nav class="space-y-1 text-sm flex-1 overflow-auto">
    <a class="flex items-center gap-2 rounded-xl px-3 py-2 text-slate-200 hover:bg-slate-700" href="../index.html"><i class="fa-solid fa-house w-4 text-center"></i><span>版本首页</span></a>
    <a class="flex items-center gap-2 rounded-xl px-3 py-2 text-slate-200 hover:bg-slate-700" href="pc_wall_command_screen.html"><i class="fa-solid fa-tv w-4 text-center"></i><span>指挥大屏拼接</span></a>
    <a class="flex items-center gap-2 rounded-xl px-3 py-2 text-slate-200 hover:bg-slate-700" href="pc_overview_port_map.html"><i class="fa-solid fa-map w-4 text-center"></i><span>港区概览一张图</span></a>

    <a class="flex items-center gap-2 rounded-xl px-3 py-2 text-slate-200 hover:bg-slate-700" href="pc_equipment_map.html"><i class="fa-solid fa-gears w-4 text-center"></i><span>设备设施一张图</span></a>
    <a class="flex items-center gap-2 rounded-xl px-3 py-2 text-slate-200 hover:bg-slate-700" href="pc_business_map.html"><i class="fa-solid fa-chart-pie w-4 text-center"></i><span>经营分析一张图</span></a>

    <a class="flex items-center gap-2 rounded-xl px-3 py-2 bg-slate-700 text-white" href="pc_resource_center.html"><i class="fa-solid fa-layer-group w-4 text-center"></i><span>资源中心</span></a>

    <a class="flex items-center gap-2 rounded-xl px-3 py-2 text-slate-200 hover:bg-slate-700" href="pc_model_manage.html"><i class="fa-solid fa-cube w-4 text-center"></i><span>模型管理</span></a>
    <a class="flex items-center gap-2 rounded-xl px-3 py-2 text-slate-200 hover:bg-slate-700" href="pc_data_status.html"><i class="fa-solid fa-heart-pulse w-4 text-center"></i><span>接口与数据状态</span></a>
  </nav>
  <a class="text-xs text-slate-400 hover:text-white mt-3" href="../../index.html">返回总入口</a>

<main class="flex-1 min-w-0 p-5 md:p-6 overflow-auto">
  <div class="max-w-[1400px] mx-auto">
    <div class="text-xs text-slate-400 mb-2">首页 / 运维 / 资源中心</div>
    <header class="flex flex-wrap justify-between gap-3 mb-4">
      <div>
        <h2 class="text-2xl font-semibold">资源中心</h2>
        <p class="text-sm text-slate-500 mt-1">专题模板与可复用组件。应用到主题后，由指挥大屏编排微调，不替代源系统。</p>
      </div>
      <input id="q" class="rounded-xl border border-slate-200 px-3 py-2 text-sm h-fit" placeholder="搜索模板 / 组件">
    </header>
    <section id="cards" class="grid md:grid-cols-2 xl:grid-cols-3 gap-4 mb-4"></section>
    <section class="bg-white rounded-2xl shadow-[0_4px_12px_rgba(0,0,0,0.05)] overflow-hidden">
      <div class="px-4 py-3 border-b text-sm font-semibold">已应用到专题</div>
      <table class="w-full text-sm">
        <thead class="bg-slate-100 text-xs text-slate-600"><tr>
          <th class="text-left px-3 py-2">模板</th><th class="text-left px-3 py-2">目标</th><th class="text-left px-3 py-2">版本</th><th class="text-left px-3 py-2">状态</th>
        </tr></thead>
        <tbody id="applied">
          <tr class="border-t"><td class="px-3 py-2">双泊位指挥</td><td class="px-3 py-2">概览大屏</td><td class="px-3 py-2">v1.0.0</td><td class="px-3 py-2 text-emerald-600">使用中</td></tr>
          <tr class="border-t"><td class="px-3 py-2">装卸进度</td><td class="px-3 py-2">生产一张图</td><td class="px-3 py-2">v1.0.0</td><td class="px-3 py-2 text-emerald-600">使用中</td></tr>
        </tbody>
      </table>
    </section>
  </div>
</main>
<div id="apply" class="hidden fixed inset-0 z-40 bg-slate-900/40 flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl w-full max-w-md p-5 shadow-[0_12px_40px_rgba(0,0,0,0.12)]">
    <h3 class="font-semibold text-lg">应用到专题</h3>
    <p id="apply-name" class="text-sm text-slate-500 mt-1"></p>
    <select id="apply-target" class="mt-3 w-full rounded-xl border px-3 py-2 text-sm">
      <option>概览大屏</option><option>生产一张图</option><option>交通一张图</option><option>设备设施一张图</option><option>经营分析一张图</option><option>智慧调度一张图</option>
    </select>
    <p class="text-xs text-slate-400 mt-2">应用后保留现有数据对象，只替换展示组件组合。</p>
    <div class="mt-5 flex justify-end gap-2">
      <button class="rounded-xl border px-4 py-2" onclick="document.getElementById('apply').classList.add('hidden')">取消</button>
      <button id="apply-ok" class="rounded-xl bg-slate-800 text-white px-4 py-2">确认应用</button>
    </div>
  </div>
</div>
<div id="toast" class="fixed right-4 bottom-4 z-50 hidden rounded-xl bg-slate-900 text-white text-sm px-4 py-3 shadow-lg"></div>
<script>
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.remove('hidden');clearTimeout(window.__tt);window.__tt=setTimeout(()=>t.classList.add('hidden'),1600);}
const TPLS=[
  {name:'双泊位指挥',desc:'1#水泥熟料 / 2#河砂，KPI 与告警同屏',parts:'泊位对、货种条、视频四宫格'},
  {name:'装卸进度',desc:'船、卸船机、皮带、堆场一条链路',parts:'进度条、在泊表、设备状态'},
  {name:'卡口拥堵',desc:'卡口排队、轨迹与视频核验',parts:'拥堵榜、轨迹、离线标识'},
  {name:'设备健康',desc:'在线率、振动告警、利用率',parts:'健康分、故障趋势'},
  {name:'吞吐经营',desc:'年设计 700 万吨进度、货种结构与船时效率',parts:'翻牌、货种排行、效率预警'},
  {name:'应急联动',desc:'事件定位、应急资源、广播提示',parts:'事件卡、资源清单、视频'}
];
let pick=TPLS[0];
function draw(){
  const q=document.getElementById('q').value.trim();
  document.getElementById('cards').innerHTML=TPLS.filter(t=>!q||(t.name+t.desc+t.parts).includes(q)).map(t=>`
    <article class="bg-white rounded-2xl p-5 shadow-[0_4px_12px_rgba(0,0,0,0.05)] hover:-translate-y-1 hover:shadow-[0_8px_24px_rgba(0,0,0,0.08)] transition">
      <h3 class="font-semibold">${t.name}</h3>
      <p class="text-sm text-slate-500 mt-1">${t.desc}</p>
      <p class="text-xs text-slate-400 mt-2">组件：${t.parts}</p>
      <button data-name="${t.name}" class="mt-3 rounded-xl bg-slate-800 text-white px-3 py-2 text-sm">应用到专题</button>
    </article>`).join('') || '<p class="text-sm text-slate-400">没有匹配的模板</p>';
  document.querySelectorAll('#cards button').forEach(b=>b.onclick=()=>{
    pick=TPLS.find(t=>t.name===b.dataset.name);
    document.getElementById('apply-name').textContent=pick.name+' · '+pick.parts;
    document.getElementById('apply').classList.remove('hidden');
  });
}
document.getElementById('q').oninput=draw;
document.getElementById('apply-ok').onclick=()=>{
  const target=document.getElementById('apply-target').value;
  const tb=document.getElementById('applied');
  const tr=document.createElement('tr');
  tr.className='border-t bg-sky-50';
  tr.innerHTML=`<td class="px-3 py-2">${pick.name}</td><td class="px-3 py-2">${target}</td><td class="px-3 py-2">v1.0.0</td><td class="px-3 py-2 text-sky-700">刚应用</td>`;
  tb.prepend(tr);
  document.getElementById('apply').classList.add('hidden');
  toast('「'+pick.name+'」已应用到'+target);
};
draw();
</script>
</body>
</html>
